name: Generate signing key

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: Passphrase for the GPG signing key
        required: true

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate primary-only RSA-4096 key
        run: |
          gpg --batch --full-generate-key <<EOF
          Key-Type: RSA
          Key-Length: 4096
          Expire-Date: 0
          Name-Real: Noam
          Name-Email: noam@noamm.org
          Passphrase: ${{ github.event.inputs.passphrase }}
          %commit
          EOF
      - name: Print key id and armored secret key
        run: |
          ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/sec/{print $2}' | cut -d/ -f2)
          echo "KEY_ID=$ID"
          echo "--- SECRET KEY ---"
          gpg --export-secret-keys --armor "$ID"
      - name: Publish public key to keyserver
        run: |
          ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/sec/{print $2}' | cut -d/ -f2)
          gpg --keyserver keyserver.ubuntu.com --send-keys "$ID"